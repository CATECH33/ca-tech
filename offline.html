<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="theme-color" content="#0066FF"/>
  <title>Hors ligne — CA-TECH</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    :root{--blue:#0066FF;--cyan:#00D4FF;--dark:#0A2540}
    body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--dark);color:#fff;font-family:'Inter',system-ui,sans-serif;text-align:center;padding:2rem}
    .card{max-width:420px}
    .icon{width:80px;height:80px;margin:0 auto 2rem;border-radius:20px;overflow:hidden}
    .icon img{width:100%;height:100%;object-fit:cover}
    h1{font-size:1.6rem;font-weight:700;margin-bottom:.75rem}
    p{color:rgba(255,255,255,.65);line-height:1.6;margin-bottom:2rem}
    .btn{display:inline-block;background:var(--blue);color:#fff;padding:12px 28px;border-radius:10px;text-decoration:none;font-weight:600;font-size:.9rem;transition:background .2s}
    .btn:hover{background:#1a7aff}
    .dot{display:inline-block;width:8px;height:8px;background:var(--cyan);border-radius:50%;margin-right:.5rem;animation:pulse 1.5s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <img src="/icons/icon-192x192.png" alt="CA-TECH"/>
    </div>
    <h1>Vous êtes hors ligne</h1>
    <p><span class="dot"></span>Vérifiez votre connexion internet puis réessayez.</p>
    <a href="/" class="btn" onclick="location.reload();return false">Réessayer</a>
  </div>
</body>
</html>
